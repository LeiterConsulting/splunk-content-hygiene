[script:content_hygiene_reviews]
match = /content_hygiene/review_revisions
scripttype = persist
python.version = python3
python.required = 3.9,3.13
script = content_hygiene_reviews.py
handler = content_hygiene_reviews.ReviewCoordinator
requireAuthentication = true
capability = content_hygiene_review or admin_all_objects
passSystemAuth = false
passPayload = true
output_modes = json
max_content_length = 4 MiB
