[role_content_hygiene_viewer]
importRoles = user

[role_content_hygiene_reviewer]
importRoles = content_hygiene_viewer
content_hygiene_review = enabled

[role_content_hygiene_operator]
importRoles = content_hygiene_reviewer

[capability::content_hygiene_review]

# Existing administrators retain app access and can assign the named app roles.
# This grants only the app-local coordinator capability, no source permissions.
[role_admin]
content_hygiene_review = enabled

[role_sc_admin]
content_hygiene_review = enabled
